name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  quietbrowse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run validation
        working-directory: quietbrowse
        run: node tools/validate_extension.js

      - name: Run unit tests
        working-directory: quietbrowse
        run: node tools/test_unit.js

  trustcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10          # a hung test must fail the job, not run for hours
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run TrustCheck tests
        working-directory: trustcheck
        run: npm test
        env:
          TEST_REQUIRE_ALL: ${{ matrix.node == '22' && '1' || '' }}   # Node 22 must run every file; 18/20 skip the SQLite ones

      - name: Server self-test (crash, load, fuzz, shutdown, backup drill)
        if: matrix.node == '22'
        working-directory: trustcheck
        run: node test/selftest/run.mjs crash concurrency fuzz shutdown backup prodboot

      - name: Evaluation gates (development set + verdict drift)
        working-directory: trustcheck
        run: npm run eval:check

      - name: Evaluation gates (held-out set, aggregates only)
        working-directory: trustcheck
        run: npm run eval:holdout

