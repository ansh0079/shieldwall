name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  quietbrowse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run validation
        working-directory: quietbrowse
        run: node tools/validate_extension.js

      - name: Run unit tests
        working-directory: quietbrowse
        run: node tools/test_unit.js

  trustcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10          # a hung test must fail the job, not run for hours
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run TrustCheck tests
        working-directory: trustcheck
        run: npm test

