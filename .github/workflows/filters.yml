name: Refresh filters and rulesets

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || true

      - name: Build PSL
        run: npm run build:psl

      - name: Build filters and rulesets
        run: npm run build:filters

      - name: Run tests
        run: npm test

      - name: Run benchmark
        run: node tools/benchmark.js > benchmark.txt

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(filters): refresh static rulesets and cosmetics"
          title: "chore(filters): refresh static rulesets and cosmetics"
          body: |
            Automated daily refresh of bundled filter assets.

            - Rebuilt `easylist_rules.json` (incl. $removeparam)
            - Rebuilt site cosmetics and procedural index
            - Rebuilt optional static rulesets and manifest entries
            - Benchmark attached below

            ```
            $(cat benchmark.txt)
            ```
          branch: auto/filters-daily
          delete-branch: true
