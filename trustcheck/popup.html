<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
  <div id="loading">Checking this site…</div>
  <main id="main" hidden>
    <header>
      <div id="ring"><span id="score"></span></div>
      <div><h1 id="verdict"></h1><p id="domain"></p></div>
    </header>
    <div id="reviews"></div>
    <h2>Why this score</h2>
    <ul id="signals"></ul>
    <div id="history"></div>
    <h2>Report your experience</h2>
    <div id="report">
      <div id="rs1"><p>Did your order from this shop arrive?</p>
        <div class="btns"><button data-o="ok">Arrived, fine</button><button data-o="problem">Had a problem</button><button data-o="never">Never arrived</button></div></div>
      <div id="rs2" hidden><p>What went wrong? (optional)</p><div id="chips"></div><button id="send">Send report</button></div>
      <p id="rmsg" hidden></p>
    </div>
    <h2>Check independent reviews</h2>
    <div id="links"></div>
    <footer><button id="recheck">Re-check</button><a href="#" id="opts">Options</a></footer>
  </main>
  <script type="module" src="popup.js"></script>
</body></html>
