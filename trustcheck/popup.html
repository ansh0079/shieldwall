<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>TrustCheck</title>
</head>
<body>
  <div id="loading" role="status">Checking this site…</div>
  <main id="main" hidden>
    <header>
      <div id="ring" aria-label="Risk score ring"><span id="score"></span></div>
      <div>
        <div class="title-row">
          <h1 id="verdict"></h1>
          <span id="confPill" class="conf-pill"></span>
        </div>
        <p id="domain"></p>
      </div>
    </header>

    <div id="summaryBox" class="summary-box"></div>

    <div id="reviews"></div>

    <h2>Store Timeline & Telemetry</h2>
    <div id="timeline" class="timeline"></div>

    <h2>Key Findings & Evidence</h2>
    <ul id="signals"></ul>

    <details id="setupDetails" hidden>
      <summary id="setupSummary">Optional Integrations</summary>
      <ul id="setupSignals"></ul>
    </details>

    <h2>Report Your Experience</h2>
    <div id="report">
      <div id="rs1">
        <p>Did your order from this shop arrive?</p>
        <p id="proof"></p>
        <div class="btns">
          <button data-o="ok" type="button">Arrived, fine</button>
          <button data-o="problem" type="button">Had a problem</button>
          <button data-o="never" type="button">Never arrived</button>
        </div>
      </div>
      <div id="rs2" hidden>
        <p>What went wrong? (optional)</p>
        <div id="chips"></div>
        <button id="send" type="button">Send report</button>
      </div>
      <p id="rmsg" hidden></p>
    </div>

    <h2>Check Independent Sources</h2>
    <div id="links"></div>

    <footer>
      <button id="recheck" type="button">Re-check</button>
      <a href="#" id="opts">Options & Privacy</a>
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
