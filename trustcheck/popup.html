<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"></head>
<body>
  <div id="loading" role="status">Checking this site…</div>
  <main id="main" hidden>
    <header>
      <div id="ring" role="img"><span id="score"></span></div>
      <div><h1 id="verdict"></h1><p id="domain"></p><p id="conf" class="small"></p></div>
    </header>
    <p id="summary"></p>
    <h2 id="findingsH">Key findings</h2>
    <ul id="findings"></ul>
    <div id="history"></div>
    <div id="reviews"></div>
    <section id="missingWrap" hidden><h2>Not checked</h2><ul id="missing"></ul></section>
    <h2>Evidence</h2>
    <div id="groups"></div>
    <h2>Report your experience</h2>
    <div id="report">
      <div id="rs1"><p>Did your order from this shop arrive?</p>
        <div class="btns"><button data-o="ok">Arrived, fine</button><button data-o="problem">Had a problem</button><button data-o="never">Never arrived</button></div></div>
      <div id="rs2" hidden><p>What went wrong? (optional)</p><div id="chips"></div><button id="send">Send report</button></div>
      <p id="rmsg" hidden></p>
    </div>
    <h2>Check independent reviews</h2>
    <div id="links"></div>
    <details id="setupWrap" hidden><summary>Setup: connect more checks</summary><ul id="setup"></ul></details>
    <p id="disclaimer" class="small"></p>
    <footer><button id="recheck">Re-check</button><span id="fresh" class="small"></span><a href="#" id="opts">Options</a></footer>
  </main>
  <script type="module" src="popup.js"></script>
</body></html>
