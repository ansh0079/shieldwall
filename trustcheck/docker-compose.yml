# Required secrets (generate each with `openssl rand -hex 32`; keep them):
#   REPORT_SALT        re-keys network hashes if changed
#   CREDENTIAL_SECRET  signs credentials; changing it makes every client re-enrol automatically
# Required settings: ALLOWED_ORIGINS (your extension origin, e.g. chrome-extension://<id>), TRUSTED_PROXIES (your reverse proxy's range).
# ADMIN_TOKENS="alice:<24+ chars>,bob:<24+ chars>" enables the moderation API; ADMIN_CIDRS restricts it to your admin network.
services:
  trustcheck-server:
    build: .
    restart: unless-stopped
    stop_grace_period: 20s                      # the server drains in-flight requests on SIGTERM
    environment:
      REPORT_SALT: ${REPORT_SALT:?set REPORT_SALT}
      CREDENTIAL_SECRET: ${CREDENTIAL_SECRET:?set CREDENTIAL_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ADMIN_TOKENS: ${ADMIN_TOKENS:-}
      ADMIN_CIDRS: ${ADMIN_CIDRS:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      POW_BITS: "16"
    volumes: ["trustcheck-data:/data"]          # database + backups. Copy backups OFF this volume too.
    ports: ["127.0.0.1:8787:8787"]              # expose only to the local reverse proxy (HTTPS)
volumes:
  trustcheck-data:
