# REPORT_SALT: long random secret (e.g. `openssl rand -hex 32`). Keep it: changing it resets "one report per install".
services:
  trustcheck-server:
    build: .
    restart: unless-stopped
    environment:
      REPORT_SALT: ${REPORT_SALT:?set REPORT_SALT}
      MIN_REPORTS: "3"
    volumes: ["trustcheck-data:/data"]
    ports: ["127.0.0.1:8787:8787"]   # expose only to the local reverse proxy (HTTPS)
volumes:
  trustcheck-data:
